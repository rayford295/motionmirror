name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + dev, no video deps)
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit tests
        run: pytest -q

  video-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for MediaPipe
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgles2 libgl1
      - name: Install with pose extras
        run: python -m pip install -e ".[pose,dev]"
      - name: Analyze the bundled golf clip end to end
        run: |
          swingform analyze examples/golf-swing-demo/golf.mp4 --sport golf \
            --model lite --out smoke --ball-trail detect
          test -s smoke/report.json && test -s smoke/overlay.mp4 && test -s smoke/keyposes.jpg
          python -c "import json; r=json.load(open('smoke/report.json')); assert r['rep_count'] >= 1, r"
